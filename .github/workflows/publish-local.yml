# Temporary: deploy from the self-hosted runner on mini-1 (~/actions-runner-blog) while
# GitHub-hosted runners are delayed. Delete this file and that runner once they recover.
name: publish (self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-local
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, blog-local]
    steps:
      - uses: actions/checkout@v7
      - run: quarto render
      - run: tar -cvf "$RUNNER_TEMP/artifact.tar" -C _site --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: [self-hosted, blog-local]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A delayed run must not overwrite a newer deploy: deploy only the current main.
      - id: current
        run: |
          head=$(git ls-remote "${{ github.server_url }}/${{ github.repository }}" refs/heads/main | cut -f1)
          echo "current=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@v5
